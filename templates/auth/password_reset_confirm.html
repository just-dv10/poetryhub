<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoetryHub — Set New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; overflow: hidden; background: #0e0c0a; }
        .bg-animate { position: fixed; inset: 0; background: linear-gradient(135deg, #0e0c0a, #1a140f, #150f0b, #0e0c0a); background-size: 400% 400%; animation: gs 10s ease infinite; z-index: 0; }
        @keyframes gs { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.32; animation: fl 14s ease-in-out infinite; z-index: 0; }
        .orb-1 { width: 450px; height: 450px; background: #d4af37; top: -120px; left: -120px; }
        .orb-2 { width: 380px; height: 380px; background: #9a3412; bottom: -100px; right: -100px; animation-delay: 4s; }
        .orb-3 { width: 260px; height: 260px; background: #78350f; top: 45%; left: 55%; animation-delay: 7s; }
        @keyframes fl { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.06); } }
        .wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 480px; max-width: 100%; background: rgba(24, 19, 15, 0.84); border-radius: 26px; border: 1px solid rgba(212, 175, 55, 0.25); backdrop-filter: blur(24px); box-shadow: 0 35px 90px rgba(0,0,0,0.8), 0 0 30px rgba(212, 175, 55, 0.08); padding: 48px 44px; }
        .icon-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 2rem; color: #0e0c0a; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35); }
        .icon-ok { background: linear-gradient(135deg, #fce9a6, #d4af37, #996515); }
        .icon-err { background: linear-gradient(135deg, #f87171, #991b1b); color: white; }
        h1 { font-family: 'Cinzel', 'Playfair Display', serif; font-size: 1.7rem; font-weight: 700; color: #fdfbf7; margin-bottom: 8px; text-align: center; letter-spacing: 0.5px; }
        .sub { color: #a69988; font-size: 0.9rem; margin-bottom: 28px; text-align: center; line-height: 1.5; }
        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.78rem; font-weight: 700; color: #e5dac9; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
        .field-group input { width: 100%; padding: 12px 16px; background: rgba(16, 12, 9, 0.75); border: 1px solid rgba(212, 175, 55, 0.22); border-radius: 12px; color: #fdfbf7; font-size: 0.92rem; outline: none; transition: border-color 0.2s, background 0.2s; }
        .field-group input::placeholder { color: rgba(166, 153, 136, 0.6); }
        .field-group input:focus { border-color: #d4af37; background: rgba(212, 175, 55, 0.08); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.22); }
        .error-text { color: #f87171; font-size: 0.82rem; margin: -4px 0 12px; text-align: center; }
        .submit-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #fce9a6 0%, #d4af37 50%, #996515 100%); border: none; border-radius: 50px; color: #0e0c0a; font-weight: 800; font-size: 0.96rem; cursor: pointer; margin-top: 8px; transition: all 0.3s; box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35); }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(212, 175, 55, 0.55); color: #000; }
        .action-btn { display: inline-block; padding: 13px 40px; background: linear-gradient(135deg, #fce9a6 0%, #d4af37 50%, #996515 100%); border: none; border-radius: 50px; color: #0e0c0a; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.3s; text-decoration: none; box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35); }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(212, 175, 55, 0.55); color: #000; }
        .back-link { display: block; margin-top: 20px; text-align: center; color: #d4af37; font-size: 0.88rem; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .back-link:hover { color: #fae596; }
    </style>
</head>
<body>
<div class="bg-animate"></div>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
<div class="wrapper">
    <div class="card">
        {% if valid %}
        <div class="icon-circle icon-ok"><i class="bi bi-shield-lock-fill"></i></div>
        <h1>Set New Password</h1>
        <p class="sub">Choose a strong, memorable password for your account.</p>
        {% if error %}<div class="error-text"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="field-group">
                <label><i class="bi bi-lock me-1"></i>New Password</label>
                <input type="password" name="password" placeholder="Min. 8 characters" required>
            </div>
            <div class="field-group">
                <label><i class="bi bi-shield-check me-1"></i>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="submit-btn"><i class="bi bi-check-lg me-1"></i> Reset Password</button>
        </form>
        {% else %}
        <div class="icon-circle icon-err"><i class="bi bi-x-lg"></i></div>
        <h1>Invalid Reset Link</h1>
        <p class="sub">This password reset link is invalid or has expired.</p>
        <div style="text-align:center;">
            <a href="{% url 'password_reset' %}" class="action-btn"><i class="bi bi-arrow-repeat me-1"></i> Request New Link</a>
        </div>
        {% endif %}
        <a href="{% url 'auth' %}" class="back-link"><i class="bi bi-arrow-left me-1"></i> Back to Sign In</a>
    </div>
</div>
</body>
</html>
