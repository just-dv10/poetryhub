<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoetryHub — Verify Your Email</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; overflow: hidden; background: #0e0c0a; }
        .bg-animate { position: fixed; inset: 0; background: linear-gradient(135deg, #0e0c0a, #1a140f, #150f0b, #0e0c0a); background-size: 400% 400%; animation: gs 10s ease infinite; z-index: 0; }
        @keyframes gs { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.32; animation: fl 14s ease-in-out infinite; z-index: 0; }
        .orb-1 { width: 450px; height: 450px; background: #d4af37; top: -120px; left: -120px; }
        .orb-2 { width: 380px; height: 380px; background: #9a3412; bottom: -100px; right: -100px; animation-delay: 4s; }
        .orb-3 { width: 260px; height: 260px; background: #78350f; top: 45%; left: 55%; animation-delay: 7s; }
        @keyframes fl { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.06); } }
        .wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 520px; max-width: 100%; background: rgba(24, 19, 15, 0.84); border-radius: 26px; border: 1px solid rgba(212, 175, 55, 0.25); backdrop-filter: blur(24px); box-shadow: 0 35px 90px rgba(0,0,0,0.8), 0 0 30px rgba(212, 175, 55, 0.08); padding: 48px 44px; text-align: center; }
        .icon-circle { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #fce9a6, #d4af37, #996515); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 2rem; color: #0e0c0a; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35); }
        h1 { font-family: 'Cinzel', 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #fdfbf7; margin-bottom: 8px; letter-spacing: 0.5px; }
        .sub { color: #a69988; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.6; }
        .email-highlight { color: #fae596; font-weight: 700; }
        .success-box { background: rgba(212, 175, 55, 0.12); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 12px; padding: 12px 16px; color: #fae596; font-size: 0.88rem; margin-bottom: 20px; }
        .resend-form { margin-top: 24px; }
        .resend-btn { display: inline-block; padding: 12px 36px; background: linear-gradient(135deg, #fce9a6 0%, #d4af37 50%, #996515 100%); border: none; border-radius: 50px; color: #0e0c0a; font-weight: 800; font-size: 0.92rem; cursor: pointer; transition: all 0.3s; letter-spacing: 0.03em; text-decoration: none; box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35); }
        .resend-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(212, 175, 55, 0.55); color: #000; }
        .back-link { display: block; margin-top: 20px; color: #d4af37; font-size: 0.88rem; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .back-link:hover { color: #fae596; }
    </style>
</head>
<body>
<div class="bg-animate"></div>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
<div class="wrapper">
    <div class="card">
        <div class="icon-circle"><i class="bi bi-envelope-paper-fill"></i></div>
        <h1>Check Your Email</h1>
        <p class="sub">
            We've sent a verification link to<br>
            <span class="email-highlight">{{ email }}</span>
        </p>
        {% if resent %}
        <div class="success-box"><i class="bi bi-check-circle-fill me-1"></i> Verification email resent successfully!</div>
        {% endif %}
        <p style="color:#8c7e6c;font-size:0.86rem;line-height:1.6;margin-bottom:24px;">
            Click the link in your email to activate your poet profile.<br>
            If you don't see it, please check your spam folder.
        </p>
        <form method="post" action="{% url 'resend_verification' %}" class="resend-form">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <button type="submit" class="resend-btn"><i class="bi bi-arrow-repeat me-1"></i> Resend Email</button>
        </form>
        <a href="{% url 'auth' %}" class="back-link"><i class="bi bi-arrow-left me-1"></i> Back to Sign In</a>
    </div>
</div>
</body>
</html>
