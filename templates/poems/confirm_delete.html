{% extends 'base.html' %}
{% block title %}Delete Poem — PoetryHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="poem-card p-4 p-md-5 text-center">
                <div style="font-size:3.5rem;">⚠️</div>
                <h3 style="font-family:'Playfair Display',serif;margin:1rem 0 0.5rem;">Delete this poem?</h3>
                <p class="text-muted mb-1"><strong>"{{ poem.title }}"</strong></p>
                <p class="text-muted" style="font-size:0.88rem;">This action cannot be undone. All comments and likes will be lost.</p>

                <div class="d-flex gap-3 justify-content-center mt-4">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger" style="border-radius:50px;padding:10px 28px;font-weight:600;">
                            <i class="bi bi-trash me-1"></i> Yes, Delete
                        </button>
                    </form>
                    <a href="{% url 'poem_detail' poem.pk %}" class="btn" style="border:1px solid #e5e0d8;border-radius:50px;padding:10px 24px;color:#666;">
                        Cancel
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
