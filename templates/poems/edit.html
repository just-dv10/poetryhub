{% extends 'base.html' %}
{% block title %}Edit "{{ poem.title }}" — PoetryHub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="text-center mb-4">
                <h2 style="font-family:'Playfair Display',serif;font-size:2rem;">
                    <i class="bi bi-pencil" style="color:#8b5cf6;"></i> Edit Poem
                </h2>
            </div>

            <div class="poem-card p-4 p-md-5">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        {{ form.title }}
                        {% if form.title.errors %}
                            <div class="text-danger small mt-1">{{ form.title.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Genre</label>
                        {{ form.genre }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Your Poem</label>
                        {{ form.content }}
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-custom">
                            <i class="bi bi-check-lg me-1"></i> Save Changes
                        </button>
                        <a href="{% url 'poem_detail' poem.pk %}" class="btn btn-outline-glass px-4">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
