{% extends 'base.html' %}
{% block title %}Leave {{ group.name }} — PoetryHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="poem-card p-4 p-md-5 text-center">
                <div style="font-size:3.5rem;">🚪</div>
                <h3 style="font-family:'Playfair Display',serif; margin:1rem 0 0.5rem;">Leave Group?</h3>
                <p class="text-muted mb-1">Are you sure you want to leave <strong>"{{ group.name }}"</strong>?</p>
                <p class="text-muted small">You will stop receiving messages from this circle until you are invited back.</p>

                <div class="d-flex gap-3 justify-content-center mt-4">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger rounded-pill px-4">
                            <i class="bi bi-box-arrow-right me-1"></i> Leave
                        </button>
                    </form>
                    <a href="{% url 'group_chat' group.pk %}" class="btn btn-outline-secondary rounded-pill px-4">
                        Stay
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
